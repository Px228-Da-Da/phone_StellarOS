<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="outerGrad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a3a3c"/>
      <stop offset="1" stop-color="#1c1c1e"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="55" y1="55" x2="145" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8e8e93"/>
      <stop offset="1" stop-color="#e5e5ea"/>
    </linearGradient>
  </defs>

  <!-- background: rounded square -->
  <rect x="0" y="0" width="200" height="200" rx="57" fill="url(#outerGrad)"/>

  <!-- subtle top inner highlight, like the inset shadow in the CSS version -->
  <rect x="1" y="1" width="198" height="198" rx="56" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- main light shape: rounded square instead of circle -->
  <rect x="55" y="55" width="90" height="90" rx="24" fill="url(#innerGrad)"/>

  <!-- dark "bite" cutout, filled with the same background gradient so it reads as a crescent -->
  <circle cx="116" cy="84" r="21" fill="url(#outerGrad)"/>
</svg>
